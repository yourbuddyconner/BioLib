name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: scripts/check.sh
      - name: Build with Lean
        uses: leanprover/lean-action@v1
      - name: Simulator checks
        run: |
          python3 -m pip install --quiet numpy scipy
          cd python && python3 test_biolib_sim.py
